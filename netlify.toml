# === TTC-App · Version 502 · netlify.toml · erstellt 03.10.2026 (V502: täglicher Tabellenabruf) ===
[build]
  functions = "netlify/functions"

# Der VAPID-PUBLIC-Key ist absichtlich öffentlich (er gehört in den Client-Code, damit
# Browser Push-Abos anlegen können). Netlifys Secrets-Scanner schlägt sonst fehl, weil
# der Wert sowohl als Umgebungsvariable als auch im Code steht. Nur den PUBLIC-Key vom
# Scan ausnehmen — der PRIVATE Schlüssel (VAPID_PRIVATE_KEY) bleibt bewusst geschützt.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VAPID_PUBLIC_KEY"

# Täglicher Versand der Termin-Erinnerungen.
# 6:00 UTC = 8:00 Uhr deutscher Sommerzeit (MESZ). Im Winter (MEZ) entspricht
# das 7:00 Uhr — für eine Morgen-Erinnerung völlig ausreichend. Wer exakt 8 Uhr
# ganzjährig will, müsste zwei Cron-Zeilen mit Monatsfiltern nutzen.
[functions."pushversand"]
  schedule = "0 6 * * *"

# V502: Tabellen der Mannschaften täglich früh abrufen (myTischtennis).
# 4:15 UTC = 6:15 Uhr Sommerzeit / 5:15 Uhr Winterzeit – vor dem Versand der Erinnerungen.
[functions."tabellen"]
  schedule = "15 4 * * *"

# Schöner Pfad für den Kalender-Feed: /.netlify/functions/calendar.ics
[[redirects]]
  from = "/.netlify/functions/calendar.ics"
  to = "/.netlify/functions/calendar"
  status = 200

# Optional noch kürzer: /kalender.ics
[[redirects]]
  from = "/kalender.ics"
  to = "/.netlify/functions/calendar"
  status = 200
