<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="theme-color" content="#0d1117" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TTC NZ" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>TT-App des TTC 1979 Niederzeuzheim e. V.</title>
    <style>
      :root {
        --bg: #0d1117; --bg2: #111827; --bg3: #1f2937;
        --border: #1f2937; --border2: #374151;
        --text: #e5e7eb; --text2: #9ca3af; --text3: #6b7280; --text4: #4b5563;
        --input-bg: #0d1117; --sel-bg: #0d1117;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body { background: var(--bg); font-family: 'Segoe UI', system-ui, sans-serif; color: var(--text); }
      #root { height: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Service Worker registrieren (Voraussetzung für Push-Nachrichten).
      // Fehler werden bewusst still behandelt: die App muss auch ohne
      // Benachrichtigungen uneingeschränkt funktionieren.
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function () {});
        });
      }
    </script>
  </body>
</html>
