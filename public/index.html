<!DOCTYPE html>
<!-- === TTC-App · Version 519 · public/index.html · erstellt 07.10.2026 (V519: Symbol je Verein) === -->
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- V498: Zoomen mit zwei Fingern erlaubt (vorher durch maximum-scale=1 gesperrt). -->
    <meta name="viewport" id="ttc-viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d1117" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TTC NZ" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/vereins-icon-192.png" />
    <title>TT-App des TTC 1979 Niederzeuzheim e. V.</title>
    <style>
      :root {
        --bg: #0d1117; --bg2: #111827; --bg3: #1f2937;
        --border: #1f2937; --border2: #374151;
        --text: #e5e7eb; --text2: #9ca3af; --text3: #6b7280; --text4: #4b5563;
        --input-bg: #0d1117; --sel-bg: #0d1117;
        /* Hoehe der Statusleiste (iPhone/iPad). Nur mit viewport-fit=cover liefert
           iOS hier einen echten Wert – ohne ist er immer 0. */
        --sat: env(safe-area-inset-top, 0px);
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      /* Kein Nachfedern beim Scrollen ueber den Rand: Sonst verschiebt iOS die ganze
         Seite unter den fixierten Menues, und darueber wird Inhalt sichtbar. */
      html, body { height: 100%; overscroll-behavior-y: none; }
      /* Deckende Flaeche hinter der Statusleiste. Wegen "black-translucent" laeuft die
         App dort drunter; ohne diese Abdeckung scheint scrollender Inhalt oberhalb der
         Menues durch. Wirkt auf jedem Bildschirm, auch ohne Kopfleiste. */
      body::before {
        content: ""; position: fixed; top: 0; left: 0; right: 0;
        height: var(--sat); background: var(--bg2);
        z-index: 2147481000; pointer-events: none;
      }
      body { background: var(--bg); font-family: 'Segoe UI', system-ui, sans-serif; color: var(--text); }
      #root { height: 100%; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // V498: Zoomen bleibt erlaubt. Nur das automatische Hineinzoomen von iPhone/iPad
      // beim Antippen kleiner Eingabefelder wird verhindert: Solange ein Feld den Fokus
      // hat, gilt kurz maximum-scale=1; beim Verlassen wird es wieder freigegeben.
      (function () {
        var vp = document.getElementById("ttc-viewport");
        if (!vp) return;
        var frei = "width=device-width, initial-scale=1, viewport-fit=cover";
        var fest = frei + ", maximum-scale=1";
        var istIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        if (!istIOS) return;
        var feld = function (el) {
          return el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.tagName === "SELECT");
        };
        document.addEventListener("focusin", function (e) {
          if (feld(e.target)) vp.setAttribute("content", fest);
        });
        document.addEventListener("focusout", function (e) {
          if (feld(e.target)) setTimeout(function () { vp.setAttribute("content", frei); }, 300);
        });
      })();

      // Service Worker registrieren (Voraussetzung für Push-Nachrichten).
      // Fehler werden bewusst still behandelt: die App muss auch ohne
      // Benachrichtigungen uneingeschränkt funktionieren.
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function () {});
        });
      }
    </script>
  </body>
</html>
